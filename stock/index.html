<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock List</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f6f8;
        }

        .page-header {
            background: #343a40;
            color: #fff;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            white-space: nowrap;
        }

        thead th {
            background: #007bff;
            color: #fff;
            border: 0;
        }

        tbody tr:hover {
            background: #f1f7ff;
        }

        .loading {
            padding: 40px;
            text-align: center;
        }

        .error {
            padding: 20px;
        }
    </style>
</head>

<body>

<header class="page-header">
    <div class="container">
        <h1 class="h3 mb-1">Stock List</h1>
<!--        <p class="mb-0 text-light">-->
<!--            All records from the spreadsheet-->
<!--        </p>-->
    </div>
</header>

<main class="container mb-5">

    <div class="table-container">

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>

            <p class="mt-3 mb-0">
                Loading Google Sheet data...
            </p>
        </div>

        <!-- Error -->
        <div id="error"
             class="alert alert-danger error"
             style="display:none;">
        </div>

        <!-- Column toggles -->
        <div id="columnToggles"
             class="mb-3"
             style="display:none;">
            <strong class="d-block mb-2">Show / hide columns:</strong>
            <div id="columnToggleList"
                 class="d-flex flex-wrap"></div>
        </div>

        <!-- Search -->
        <div id="searchWrapper" class="mb-3" style="display:none;">
            <div class="d-flex flex-wrap align-items-center">
                <input type="text"
                       id="searchInput"
                       class="form-control mr-2 mb-2"
                       style="max-width:320px;"
                       placeholder="Search across all columns...">

                <button type="button"
                        id="restockBtn"
                        class="btn btn-warning mb-2 mr-2">
                    Show restock needed
                </button>

                <button type="button"
                        id="editModeBtn"
                        class="btn btn-outline-primary mb-2">
                    Enable edit mode
                </button>
            </div>
        </div>

        <!-- Table -->
        <div id="tableWrapper"
             class="table-responsive"
             style="display:none;">

            <table id="sheetTable"
                   class="table table-bordered table-hover table-striped mb-0">

                <thead>
                    <tr id="tableHeader"></tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

</main>

<script>

    /*
     * Replace this with your own endpoint.
     *
     * Expected JSON:
     *
     * [
     *   {
     *      "Name": "John",
     *      "Age": 25,
     *      "City": "Delhi"
     *   },
     *   {
     *      "Name": "Rahul",
     *      "Age": 30,
     *      "City": "Mumbai"
     *   }
     * ]
     */

    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7sW_z-Fig0r9KknOWXWlAUKXz8CzETU399oW1_7P0OfE9SQDOkXQfqkkxJqzO-m4GAhf79R0Jiayy/pub?output=csv";

    /*
     * Google Apps Script Web App URL used to WRITE
     * updates back to the sheet.
     *
     * A published CSV link is read-only, so saving
     * edits requires a deployed Apps Script endpoint.
     * See the setup instructions provided separately.
     *
     * Replace this with your own /exec URL.
     */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhfJJ82ikSUnEqD8YbR88mSXyLA3LSg2Sm4XcBz11UMCg0r2Y8KzTjlihnATgDWhyipw/exec";
    let sheetData = [];

    /*
     * Columns that are hidden by default.
     * Edit this list to control which columns start hidden.
     * Their values appear only when the checkbox is ticked.
     */
    const DEFAULT_HIDDEN_COLUMNS = ["Alert", "Stock"];

    /*
     * Set of column names currently hidden.
     */
    let hiddenColumns = new Set();

    /*
     * Whether the restock-only filter is active.
     */
    let restockOnly = false;

    /*
     * Whether inline edit mode is active.
     */
    let editMode = false;


    async function loadSheetData() {

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const tableWrapper = document.getElementById("tableWrapper");
        const searchWrapper = document.getElementById("searchWrapper");

        try {

            const response = await fetch(GOOGLE_SHEET_URL);

            if (!response.ok) {
                throw new Error(
                    "Unable to load Google Sheet data."
                );
            }

            const csv = await response.text();
            sheetData = parseCsv(csv);

            if (!Array.isArray(sheetData) || sheetData.length === 0) {
                throw new Error(
                    "No data found in the Google Sheet."
                );
            }

            buildColumnToggles();
            createTable(sheetData);

            loading.style.display = "none";
            tableWrapper.style.display = "block";
            searchWrapper.style.display = "block";

            document.getElementById("columnToggles").style.display = "block";

            document.getElementById("searchInput")
                .addEventListener("input", handleSearch);

            document.getElementById("restockBtn")
                .addEventListener("click", toggleRestock);

            document.getElementById("editModeBtn")
                .addEventListener("click", toggleEditMode);

        } catch (err) {

            loading.style.display = "none";

            error.textContent = err.message ||
                "Something went wrong.";

            error.style.display = "block";
        }
    }


    function buildColumnToggles() {

        const list = document.getElementById("columnToggleList");

        list.innerHTML = "";

        const columns = Object.keys(sheetData[0]);

        /*
         * Start with the configured columns hidden.
         * Matching is case-insensitive so header casing
         * does not need to match exactly.
         */
        const hiddenLower = DEFAULT_HIDDEN_COLUMNS.map(function(name) {
            return name.toLowerCase();
        });

        hiddenColumns = new Set(
            columns.filter(function(column) {
                return hiddenLower.indexOf(column.toLowerCase()) !== -1;
            })
        );

        columns.forEach(function(column) {

            const wrapper = document.createElement("div");
            wrapper.className = "form-check mr-3 mb-2";

            const input = document.createElement("input");
            input.type = "checkbox";
            input.className = "form-check-input";
            input.id = "toggle-" + column;
            input.checked = !hiddenColumns.has(column);

            input.addEventListener("change", function() {

                if (input.checked) {
                    hiddenColumns.delete(column);
                } else {
                    hiddenColumns.add(column);
                }

                /*
                 * Re-render using the current search term.
                 */
                handleSearch({
                    target: document.getElementById("searchInput")
                });
            });

            const label = document.createElement("label");
            label.className = "form-check-label";
            label.setAttribute("for", input.id);
            label.textContent = column;

            wrapper.appendChild(input);
            wrapper.appendChild(label);

            list.appendChild(wrapper);
        });
    }


    function handleSearch() {

        applyFilters();
    }


    function toggleRestock() {

        restockOnly = !restockOnly;

        const button = document.getElementById("restockBtn");

        if (restockOnly) {
            button.classList.remove("btn-warning");
            button.classList.add("btn-success");
            button.textContent = "Show all items";
        } else {
            button.classList.remove("btn-success");
            button.classList.add("btn-warning");
            button.textContent = "Show restock needed";
        }

        applyFilters();
    }


    function toggleEditMode() {

        editMode = !editMode;

        const button = document.getElementById("editModeBtn");

        if (editMode) {
            button.classList.remove("btn-outline-primary");
            button.classList.add("btn-primary");
            button.textContent = "Disable edit mode";
        } else {
            button.classList.remove("btn-primary");
            button.classList.add("btn-outline-primary");
            button.textContent = "Enable edit mode";
        }

        applyFilters();
    }


    /*
     * Find the actual column name matching the given
     * label, ignoring case. Returns null if not found.
     */
    function findColumn(label) {

        if (sheetData.length === 0) {
            return null;
        }

        const target = label.toLowerCase();

        return Object.keys(sheetData[0]).find(function(column) {
            return column.toLowerCase() === target;
        }) || null;
    }


    /*
     * Apply the search term and restock filter together.
     */
    function applyFilters() {

        const term = document.getElementById("searchInput")
            .value.trim().toLowerCase();

        let filtered = sheetData;

        /*
         * Restock filter: Stock < Alert
         */
        if (restockOnly) {

            const stockColumn = findColumn("Stock");
            const alertColumn = findColumn("Alert");

            if (stockColumn && alertColumn) {

                filtered = filtered.filter(function(row) {

                    const stock = parseFloat(row[stockColumn]);
                    const alert = parseFloat(row[alertColumn]);

                    if (isNaN(stock) || isNaN(alert)) {
                        return false;
                    }

                    return stock < alert;
                });
            }
        }

        /*
         * Search filter across all columns.
         */
        if (term !== "") {

            filtered = filtered.filter(function(row) {
                return Object.values(row).some(function(value) {
                    return String(value).toLowerCase().includes(term);
                });
            });
        }

        createTable(filtered, filtered.length === 0);
    }


    function parseCsv(csv) {

        const rows = [];
        let row = [];
        let field = "";
        let insideQuotes = false;

        for (let index = 0; index < csv.length; index++) {

            const character = csv[index];
            const nextCharacter = csv[index + 1];

            if (character === '"' && insideQuotes && nextCharacter === '"') {
                field += '"';
                index++;
            } else if (character === '"') {
                insideQuotes = !insideQuotes;
            } else if (character === "," && !insideQuotes) {
                row.push(field);
                field = "";
            } else if ((character === "\n" || character === "\r") && !insideQuotes) {
                if (character === "\r" && nextCharacter === "\n") {
                    index++;
                }
                row.push(field);
                if (row.some(function(value) { return value.trim() !== ""; })) {
                    rows.push(row);
                }
                row = [];
                field = "";
            } else {
                field += character;
            }
        }

        if (field !== "" || row.length > 0) {
            row.push(field);
            rows.push(row);
        }

        const columns = rows.shift() || [];

        return rows.map(function(values) {
            const item = {};

            columns.forEach(function(column, index) {
                item[column.trim()] = (values[index] || "").trim();
            });

            return item;
        });
    }


    function createTable(data, noResults) {

        const header = document.getElementById("tableHeader");
        const body = document.getElementById("tableBody");

        header.innerHTML = "";
        body.innerHTML = "";

        /*
         * Get column names from the full dataset,
         * excluding any that are currently hidden.
         */
        const columns = Object.keys(sheetData[0]).filter(function(column) {
            return !hiddenColumns.has(column);
        });


        /*
         * Create table header
         */
        columns.forEach(function(column) {

            const th = document.createElement("th");

            th.textContent = column;

            header.appendChild(th);

        });

        /*
         * Extra header cell for edit actions.
         */
        if (editMode) {

            const actionsTh = document.createElement("th");
            actionsTh.textContent = "Actions";
            header.appendChild(actionsTh);
        }


        /*
         * Show a message when there are no matches.
         */
        if (noResults) {

            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = columns.length + (editMode ? 1 : 0);
            td.className = "text-center text-muted";
            td.textContent = "No matching records found.";

            tr.appendChild(td);
            body.appendChild(tr);

            return;
        }


        /*
         * Create table rows
         */
        data.forEach(function(row) {

            const tr = document.createElement("tr");

            columns.forEach(function(column) {

                const td = document.createElement("td");

                td.textContent =
                    row[column] !== undefined
                        ? row[column]
                        : "";

                tr.appendChild(td);

            });

            /*
             * Add an edit (pencil) button when edit mode is on.
             */
            if (editMode) {

                const actionTd = document.createElement("td");
                actionTd.className = "text-center";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "btn btn-sm btn-outline-secondary";
                editButton.title = "Edit row";
                editButton.innerHTML = "&#9998;";

                editButton.addEventListener("click", function() {
                    startRowEdit(tr, row, columns);
                });

                actionTd.appendChild(editButton);
                tr.appendChild(actionTd);
            }

            body.appendChild(tr);

        });

    }


    /*
     * Turn a row's visible cells into editable inputs and
     * swap the pencil button for Save / Cancel controls.
     */
    function startRowEdit(tr, row, columns) {

        const cells = tr.querySelectorAll("td");

        /*
         * Replace each data cell with an input.
         */
        columns.forEach(function(column, index) {

            const td = cells[index];

            const input = document.createElement("input");
            input.type = "text";
            input.className = "form-control form-control-sm";
            input.value = row[column] !== undefined ? row[column] : "";
            input.dataset.column = column;

            td.innerHTML = "";
            td.appendChild(input);
        });

        /*
         * Last cell holds the action buttons.
         */
        const actionTd = cells[cells.length - 1];
        actionTd.innerHTML = "";

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.className = "btn btn-sm btn-success mr-1";
        saveButton.textContent = "Save";

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "btn btn-sm btn-secondary";
        cancelButton.textContent = "Cancel";

        saveButton.addEventListener("click", function() {
            saveRowEdit(tr, row, columns, saveButton, cancelButton);
        });

        cancelButton.addEventListener("click", function() {
            applyFilters();
        });

        actionTd.appendChild(saveButton);
        actionTd.appendChild(cancelButton);
    }


    /*
     * Collect edited values, update the sheet via the
     * Apps Script endpoint, then refresh the table.
     */
    async function saveRowEdit(tr, row, columns, saveButton, cancelButton) {

        const cells = tr.querySelectorAll("td");
        const updates = {};

        columns.forEach(function(column, index) {

            const input = cells[index].querySelector("input");

            if (input) {
                updates[column] = input.value;
            }
        });

        /*
         * Disable buttons while saving.
         */
        saveButton.disabled = true;
        cancelButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            await updateSheetRow(row, updates);

            /*
             * Apply changes locally so the UI stays in sync.
             */
            Object.keys(updates).forEach(function(column) {
                row[column] = updates[column];
            });

        } catch (err) {

            alert(
                "Could not save changes: " +
                (err.message || "Unknown error")
            );

        } finally {

            /*
             * Re-render (also restores the pencil button).
             */
            applyFilters();
        }
    }


    /*
     * Send a single row update to the Apps Script Web App.
     *
     * Payload:
     * {
     *   "rowNumber": <sheet row number>,
     *   "values": { "Column": "Value", ... }
     * }
     */
    async function updateSheetRow(row, updates) {

        if (
            !APPS_SCRIPT_URL ||
            APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0
        ) {
            throw new Error(
                "Apps Script URL is not configured. " +
                "See the setup instructions to enable saving."
            );
        }

        /*
         * Sheet row number: data index + 2
         * (+1 for the header row, +1 for 1-based rows).
         */
        const rowNumber = sheetData.indexOf(row) + 2;

        const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            /*
             * text/plain avoids a CORS preflight, which
             * Apps Script Web Apps do not handle.
             */
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                rowNumber: rowNumber,
                values: updates
            })
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        const result = await response.json();

        if (!result || result.status !== "success") {
            throw new Error(
                (result && result.message) || "Update failed."
            );
        }

        return result;
    }


    /*
     * Start loading.
     */
    loadSheetData();

</script>

</body>
</html>
