<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock List</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f6f8;
        }

        .page-header {
            background: #343a40;
            color: #fff;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            white-space: nowrap;
        }

        thead th {
            background: #007bff;
            color: #fff;
            border: 0;
        }

        tbody tr:hover {
            background: #f1f7ff;
        }

        .loading {
            padding: 40px;
            text-align: center;
        }

        .error {
            padding: 20px;
        }
    </style>
</head>

<body>

<header class="page-header">
    <div class="container">
        <h1 class="h3 mb-1">Stock List</h1>
        <p class="mb-0 text-light">
            All records from the spreadsheet
        </p>
    </div>
</header>

<main class="container mb-5">

    <div class="table-container">

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>

            <p class="mt-3 mb-0">
                Loading Google Sheet data...
            </p>
        </div>

        <!-- Error -->
        <div id="error"
             class="alert alert-danger error"
             style="display:none;">
        </div>

        <!-- Search -->
        <div id="searchWrapper" class="mb-3" style="display:none;">
            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="Search across all columns...">
        </div>

        <!-- Table -->
        <div id="tableWrapper"
             class="table-responsive"
             style="display:none;">

            <table id="sheetTable"
                   class="table table-bordered table-hover table-striped mb-0">

                <thead>
                    <tr id="tableHeader"></tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

</main>

<script>

    /*
     * Replace this with your own endpoint.
     *
     * Expected JSON:
     *
     * [
     *   {
     *      "Name": "John",
     *      "Age": 25,
     *      "City": "Delhi"
     *   },
     *   {
     *      "Name": "Rahul",
     *      "Age": 30,
     *      "City": "Mumbai"
     *   }
     * ]
     */

    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7sW_z-Fig0r9KknOWXWlAUKXz8CzETU399oW1_7P0OfE9SQDOkXQfqkkxJqzO-m4GAhf79R0Jiayy/pub?output=csv";

    let sheetData = [];


    async function loadSheetData() {

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const tableWrapper = document.getElementById("tableWrapper");
        const searchWrapper = document.getElementById("searchWrapper");

        try {

            const response = await fetch(GOOGLE_SHEET_URL);

            if (!response.ok) {
                throw new Error(
                    "Unable to load Google Sheet data."
                );
            }

            const csv = await response.text();
            sheetData = parseCsv(csv);

            if (!Array.isArray(sheetData) || sheetData.length === 0) {
                throw new Error(
                    "No data found in the Google Sheet."
                );
            }

            createTable(sheetData);

            loading.style.display = "none";
            tableWrapper.style.display = "block";
            searchWrapper.style.display = "block";

            document.getElementById("searchInput")
                .addEventListener("input", handleSearch);

        } catch (err) {

            loading.style.display = "none";

            error.textContent = err.message ||
                "Something went wrong.";

            error.style.display = "block";
        }
    }


    function handleSearch(event) {

        const term = event.target.value.trim().toLowerCase();

        if (term === "") {
            createTable(sheetData);
            return;
        }

        const filtered = sheetData.filter(function(row) {
            return Object.values(row).some(function(value) {
                return String(value).toLowerCase().includes(term);
            });
        });

        createTable(filtered, filtered.length === 0);
    }


    function parseCsv(csv) {

        const rows = [];
        let row = [];
        let field = "";
        let insideQuotes = false;

        for (let index = 0; index < csv.length; index++) {

            const character = csv[index];
            const nextCharacter = csv[index + 1];

            if (character === '"' && insideQuotes && nextCharacter === '"') {
                field += '"';
                index++;
            } else if (character === '"') {
                insideQuotes = !insideQuotes;
            } else if (character === "," && !insideQuotes) {
                row.push(field);
                field = "";
            } else if ((character === "\n" || character === "\r") && !insideQuotes) {
                if (character === "\r" && nextCharacter === "\n") {
                    index++;
                }
                row.push(field);
                if (row.some(function(value) { return value.trim() !== ""; })) {
                    rows.push(row);
                }
                row = [];
                field = "";
            } else {
                field += character;
            }
        }

        if (field !== "" || row.length > 0) {
            row.push(field);
            rows.push(row);
        }

        const columns = rows.shift() || [];

        return rows.map(function(values) {
            const item = {};

            columns.forEach(function(column, index) {
                item[column.trim()] = (values[index] || "").trim();
            });

            return item;
        });
    }


    function createTable(data, noResults) {

        const header = document.getElementById("tableHeader");
        const body = document.getElementById("tableBody");

        header.innerHTML = "";
        body.innerHTML = "";

        /*
         * Get column names from the full dataset.
         */
        const columns = Object.keys(sheetData[0]);


        /*
         * Create table header
         */
        columns.forEach(function(column) {

            const th = document.createElement("th");

            th.textContent = column;

            header.appendChild(th);

        });


        /*
         * Show a message when there are no matches.
         */
        if (noResults) {

            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = columns.length;
            td.className = "text-center text-muted";
            td.textContent = "No matching records found.";

            tr.appendChild(td);
            body.appendChild(tr);

            return;
        }


        /*
         * Create table rows
         */
        data.forEach(function(row) {

            const tr = document.createElement("tr");

            columns.forEach(function(column) {

                const td = document.createElement("td");

                td.textContent =
                    row[column] !== undefined
                        ? row[column]
                        : "";

                tr.appendChild(td);

            });

            body.appendChild(tr);

        });

    }


    /*
     * Start loading.
     */
    loadSheetData();

</script>

</body>
</html>
